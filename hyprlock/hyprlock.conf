source = colors.conf

$font=Roboto

auth {
  pam:enabled = true
  pam:module = hyprlock
}

# GENERAL
general {
  hide_cursor = true
}

background {
  color = $surface_container
}

# LAYOUT
label {
  monitor =
  text = Layout: $LAYOUT
  color = $on_surface
  font_size = 25
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
}

# TIME
label {
  monitor =
  text = $TIME
  color = $on_surface
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d.%m.%Y"
  color = $on_surface
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60

  fade_on_empty = false
  hide_input = false

  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true

  outline_thickness = 2
  outer_color = $primary

  inner_color = $surface_container

  font_color = $on_surface

  placeholder_text = 󰌾  Logged in as $USER

  fail_color = $error
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $error

  position = 0, -47
  halign = center
  valign = center
}
