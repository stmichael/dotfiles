[ids]

*

[main]
tab = lettermod(tabnavigation, tab, 150, 200)
capslock = overload(control, esc)

[alt]
# composite umlaut
q = macro(rightalt Z)
# composite aigu
w = macro(rightalt z)
# composite grave
e = macro(rightalt S-=)

# Cursor navigation
i = up
k = down
j = left
l = right
h = C-home
u = C-left
o = C-right

# Text modification
f = delete

space = toggle(selection)

[shift+alt]
# Cursor navigation
i = pageup
k = pagedown
j = home
l = end
h = C-end
u = C-up
o = C-down

[tabnavigation]
u = C-pageup
o = C-pagedown
j = C-A-pageup
l = C-A-pagedown

[selection]

[selection+alt]
# Cursor navigation with selection
i = S-up
k = S-down
j = S-left
l = S-right
h = S-C-home
u = S-C-left
o = S-C-right

[selection+shift+alt]
# Cursor navigation with selection
i = S-pageup
k = S-pagedown
j = S-home
l = S-end
h = S-C-end
u = S-C-up
o = S-C-down
