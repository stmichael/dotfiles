general {
    lock_cmd = hyprctl dispatch "hl.dsp.submap('reset')" && pidof hyprlock || hyprlock
    before_sleep_cmd = hyprctl dispatch "hl.dsp.submap('reset')" && loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

listener {
    timeout = 60 # 1min
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 120 # 2min
    on-timeout = hyprctl dispatch "hl.dsp.submap('reset')" && loginctl lock-session
}

listener {
    timeout = 300 # 5min
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = 'off' })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'on' })"
}

listener {
    timeout = 600 # 10min
    on-timeout = systemctl suspend
}
