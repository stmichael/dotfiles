# statusbar
source-file ~/.config/tmux/colors.conf

set -g status-justify left
set -g status-style 'bg=#{@surface}'

set -g status-left ''
set -g status-left-length 10

set -g status-right ''
set -g status-right-length 10

setw -g window-status-current-format '#[fg=#{@surface},bg=#{@primary} ]#[fg=#{@on-primary},bg=#{@primary} ] #I #[fg=#{@primary},bg=#{@surface} ]'

setw -g window-status-format '#[fg=#{@surface},bg=#{@secondary-container} ]#[fg=#{@on-secondary-container},bg=#{@secondary-container} ] #I #[fg=#{@secondary-container},bg=#{@surface} ]'

# Initialize TMUX plugin manager
set -g @plugin 'tmux-plugins/tpm'
run '/usr/share/tmux-plugin-manager/tpm'
